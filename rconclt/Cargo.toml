[package]
name = "rconclt"
description = "Command-line client for BattlEye and Source RCon servers"
license = "MIT"
repository = "https://github.com/conqp/rcon-rs"
categories = ["command-line-utilities"]
keywords = ["rcon", "battleye", "source", "cli"]
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
log = { workspace = true }
rcon = { workspace = true, features = ["battleye", "source"] }
rpassword = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[lints]
workspace = true